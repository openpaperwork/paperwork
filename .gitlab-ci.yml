.base_windows: &base_windows
  variables:
    MSYSTEM: "UCRT64"
    CHERE_INVOKING: "yes"
    RUNNER_AFTER_SCRIPT_TIMEOUT: 30m
  before_script:
    # Libinsane build dependencies
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S make
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S mingw-w64-ucrt-x86_64-cunit
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S mingw-w64-ucrt-x86_64-doxygen
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S mingw-w64-ucrt-x86_64-gcc
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S mingw-w64-ucrt-x86_64-gobject-introspection
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S mingw-w64-ucrt-x86_64-meson
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S mingw-w64-ucrt-x86_64-python-gobject
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S mingw-w64-ucrt-x86_64-vala
    # Paperwork build dependencies
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S git  # for 'make version'
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S mingw-w64-ucrt-x86_64-ca-certificates
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S mingw-w64-ucrt-x86_64-cairo
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S mingw-w64-ucrt-x86_64-gdk-pixbuf2
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S mingw-w64-ucrt-x86_64-gettext
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S mingw-w64-ucrt-x86_64-gtk3
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S mingw-w64-ucrt-x86_64-libhandy
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S mingw-w64-ucrt-x86_64-libnotify
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S mingw-w64-ucrt-x86_64-poppler
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S mingw-w64-ucrt-x86_64-python-cairo
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S mingw-w64-ucrt-x86_64-python-cryptography
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S mingw-w64-ucrt-x86_64-python-cx-freeze
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S mingw-w64-ucrt-x86_64-python-pillow
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S mingw-w64-ucrt-x86_64-python-pip
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S mingw-w64-ucrt-x86_64-python-psutil
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S mingw-w64-ucrt-x86_64-python-scikit-learn
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S mingw-w64-ucrt-x86_64-python-setuptools
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S mingw-w64-ucrt-x86_64-python-six
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S mingw-w64-ucrt-x86_64-python-virtualenv
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S mingw-w64-ucrt-x86_64-python-zeroconf
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S wget  # for downloading data files
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S zip unzip


.base_windows_install: &base_windows_install
  <<: *base_windows
  script:
    # do not use the checkout from gitlab-runner. For some unknown reason, it mess up
    # setuptools_scm
    - c:\msys64\usr\bin\bash -lc "rm -rf /tmp/paperwork"
    - c:\msys64\usr\bin\bash -lc "rm -rf /tmp/venv"
    - c:\msys64\usr\bin\bash -lc "cd /tmp && git clone https://gitlab.gnome.org/World/OpenPaperwork/paperwork.git -b $CI_COMMIT_REF_NAME"
    - c:\msys64\usr\bin\bash -lc "cd /tmp/paperwork && git describe --tags --always"
    - c:\msys64\usr\bin\bash -lc "cd /tmp/paperwork && git submodule init"
    - c:\msys64\usr\bin\bash -lc "cd /tmp/paperwork && git submodule update --recursive --remote"
    # libinsane is not a Python library and therefore is installed system-wide
    - c:\msys64\usr\bin\bash -lc "cd /tmp/paperwork && make -C sub/libinsane uninstall PREFIX=/ucrt64 || true"
    # actual install
    - c:\msys64\usr\bin\bash -lc "cd /tmp/paperwork && make -C sub/libinsane install PREFIX=/ucrt64"
    - c:\msys64\usr\bin\bash -lc "virtualenv --system-site-packages /tmp/venv"
    # Workaround for pycountry and Cx_freeze
    # See https://github.com/marcelotduarte/cx_Freeze/issues/930
    - c:\msys64\usr\bin\bash -lc "cd /tmp/paperwork && . /tmp/venv/bin/activate && pip3 uninstall -y pycountry"
    - c:\msys64\usr\bin\bash -lc "cd /tmp/paperwork && . /tmp/venv/bin/activate && pip3 install --no-cache --use-pep517 pycountry==20.7.3"
    - c:\msys64\usr\bin\bash -lc "cd /tmp/paperwork && . /tmp/venv/bin/activate && make -C sub/libpillowfight install_py"
    - c:\msys64\usr\bin\bash -lc "cd /tmp/paperwork && . /tmp/venv/bin/activate && make -C sub/pyocr install_py"
    - c:\msys64\usr\bin\bash -lc "cd /tmp/paperwork && . /tmp/venv/bin/activate && make install"


tests_windows:
  stage: tests
  only:
    - branches@World/OpenPaperwork/paperwork
    - tags@World/OpenPaperwork/paperwork
  timeout: 1h
  tags:
    - windows
    - msys2
  <<: *base_windows_install
  after_script:
    # Tesseract (required for unit tests)
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S mingw-w64-ucrt-x86_64-libarchive  # missing tesseract dependency
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S mingw-w64-ucrt-x86_64-python-pytest
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S mingw-w64-ucrt-x86_64-tesseract-ocr
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S mingw-w64-ucrt-x86_64-tesseract-data-eng
    - c:\msys64\usr\bin\pacman --needed --noconfirm -S mingw-w64-ucrt-x86_64-tesseract-data-fra
    - c:\msys64\usr\bin\bash -lc "cd /tmp/paperwork && . /tmp/venv/bin/activate && export TESSDATA_PREFIX=/ucrt64/share/tessdata && make install && make test"


build_windows:
  stage: build
  only:
    - branches@World/OpenPaperwork/paperwork
    - tags@World/OpenPaperwork/paperwork
  timeout: 2h
  tags:
    - windows
    - msys2
  <<: *base_windows_install
  artifacts:
    expire_in: 2 days
    paths:
      - paperwork.zip
  after_script:
    - c:\msys64\usr\bin\bash -lc "cd /tmp/paperwork && . /tmp/venv/bin/activate && pip install cx_Freeze"
    - c:\msys64\usr\bin\bash -lc "cd /tmp/paperwork && . /tmp/venv/bin/activate && make install"
    - c:\msys64\usr\bin\bash -lc "cd /tmp/paperwork && . /tmp/venv/bin/activate && make windows_exe"
    - c:\msys64\usr\bin\bash -lc "mv /tmp/paperwork/dist/paperwork.zip ."


deploy_windows:
  stage: deploy
  only:
    - branches@World/OpenPaperwork/paperwork
    - tags@World/OpenPaperwork/paperwork
  timeout: 1h
  tags:
    - windows
    - msys2
  dependencies:
    - build_windows
  <<: *base_windows
  script:
    # We need rclone to upload the files on OVH object storage
    - c:\msys64\usr\bin\rm -f rclone-v1.53.3-windows-386.zip
    - c:\msys64\usr\bin\rm -rf rclone-v1.53.3-windows-386
    - c:\msys64\usr\bin\wget -q https://github.com/rclone/rclone/releases/download/v1.53.3/rclone-v1.53.3-windows-386.zip
    - c:\msys64\usr\bin\unzip rclone-v1.53.3-windows-386.zip
    - c:\msys64\usr\bin\cp rclone-v1.53.3-windows-386/rclone.exe /usr/bin
    # Build
    - c:\msys64\usr\bin\unzip paperwork.zip
    - c:\msys64\usr\bin\bash -lc "./paperwork.exe ping"
    - c:\msys64\usr\bin\bash -lc "./paperwork-json.exe ping"
    - c:\msys64\usr\bin\bash -lc "/tmp/paperwork/ci/deliver.sh paperwork.zip windows .zip"
